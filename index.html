<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی حدس عدد یاسر</title>
<style>
body {
  background: #172554;
  color: white;
  font-family: Tahoma;
  text-align: center;
  padding: 30px 15px;
}
.game {
  background: #1e40af;
  padding: 25px;
  border-radius: 20px;
  max-width: 400px;
  margin: auto;
}
input, button {
  padding: 13px;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  margin: 8px;
}
button {
  background: #facc15;
  cursor: pointer;
}
#message {font-size: 19px; margin: 20px;}
</style>
</head>
<body>
<div class="game">
<h1>🎮 بازی حدس عدد</h1>
<p>من یک عدد بین ۱ تا ۱۰۰ انتخاب کردم!</p>
<p>می‌تونی پیداش کنی؟</p>

<input id="guess" type="number" min="1" max="100"
placeholder="عددت رو وارد کن">

<br>
<button onclick="check()">حدس بزن</button>
<button onclick="reset()">شروع دوباره</button>

<div id="message">منتظر حدست هستم!</div>
<p>تعداد تلاش‌ها: <span id="count">۰</span></p>
</div>

<script>
let secret = Math.floor(Math.random() * 100) + 1;
let attempts = 0;
let finished = false;

function check() {
  if (finished) return;
  let input = document.getElementById("guess");
  let n = Number(input.value);
  let msg = document.getElementById("message");

  if (!input.value || n < 1 || n > 100) {
    msg.textContent = "یک عدد بین ۱ تا ۱۰۰ وارد کن!";
    return;
  }

  attempts++;
  document.getElementById("count").textContent = attempts;

  if (n === secret) {
    msg.textContent = "🎉 آفرین! برنده شدی!";
    finished = true;
  } else if (n < secret) {
    msg.textContent = "عدد من بزرگ‌تره! 🔼";
  } else {
    msg.textContent = "عدد من کوچک‌تره! 🔽";
  }
  input.value = "";
}

function reset() {
  secret = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  finished = false;
  document.getElementById("count").textContent = "۰";
  document.getElementById("message").textContent = "عدد جدید انتخاب شد! شروع کن!";
  document.getElementById("guess").value = "";
}
</script>
</body>
</html>
